<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360">
  <defs>
    <style>
      .bg { fill: #1A1D24; rx: 12px; }
      .header-bg { fill: #003B5C; }
      .row-even { fill: rgba(255,255,255,0.03); }
      .row-champ { fill: rgba(212,175,55,0.08); }
      .hdr-txt { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 600; fill: #E8E6DF; letter-spacing: 0.02em; }
      .rank-num { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 800; font-size: 15px; }
      .team-name { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; font-size: 14px; fill: #FFFEF8; }
      .cell-txt { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #C8C5BC; font-feature-settings: "tnum"; }
      .pts { font-weight: 700; font-size: 16px; fill: #FFFEF8; }
      .title { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 700; font-size: 17px; fill: #FFFEF8; }
      .sub-title { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #8A8780; letter-spacing: 0.04em; }
    </style>
    <clipPath id="tableClip">
      <rect x="24" y="58" width="572" height="278" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="620" height="360"/>

  <!-- Title area -->
  <text class="title" x="32" y="34">第一届生命杯 · 最终积分榜</text>
  <text class="sub-title" x="32" y="50">2026 LIFE CUP · STANDINGS</text>

  <!-- Table container -->
  <g clip-path="url(#tableClip)">
    <!-- Header -->
    <rect class="header-bg" x="24" y="58" width="572" height="38" rx="8"/>
    <rect class="header-bg" x="24" y="82" width="572" height="14"/>

    <!-- Header text -->
    <text class="hdr-txt" x="50" y="82">排名</text>
    <text class="hdr-txt" x="98" y="82">队伍</text>
    <text class="hdr-txt" text-anchor="middle" x="240" y="82">场</text>
    <text class="hdr-txt" text-anchor="middle" x="310" y="82">胜 / 平 / 负</text>
    <text class="hdr-txt" text-anchor="middle" x="410" y="82">进 / 失</text>
    <text class="hdr-txt" text-anchor="end" x="576" y="82">积分</text>

    <!-- Row 1: Champion -->
    <rect class="row-champ" x="24" y="96" width="572" height="44"/>
    <circle cx="46" cy="118" r="13" fill="#D4AF37"/>
    <text class="rank-num" fill="#1A1D24" x="46" y="123" text-anchor="middle">1</text>
    <circle cx="88" cy="118" r="9" fill="#2A2D36"/>
    <text class="team-name" x="106" y="123">硕博队</text>
    <text class="cell-txt" text-anchor="middle" x="240" y="123">4</text>
    <text class="cell-txt" text-anchor="middle" x="310" y="123">4 / 0 / 0</text>
    <text class="cell-txt" text-anchor="middle" x="410" y="123">26 / 15</text>
    <text class="pts" text-anchor="end" x="576" y="124">12</text>

    <!-- Row 2 -->
    <rect x="24" y="140" width="572" height="44"/>
    <circle cx="46" cy="162" r="13" fill="#3A3D46"/>
    <text class="rank-num" fill="#FFFEF8" x="46" y="167" text-anchor="middle">2</text>
    <circle cx="88" cy="162" r="9" fill="#2A2D36"/>
    <text class="team-name" x="106" y="167">大一队</text>
    <text class="cell-txt" text-anchor="middle" x="240" y="167">4</text>
    <text class="cell-txt" text-anchor="middle" x="310" y="167">3 / 0 / 1</text>
    <text class="cell-txt" text-anchor="middle" x="410" y="167">26 / 10</text>
    <text class="pts" text-anchor="end" x="576" y="168">9</text>

    <!-- Row 3 -->
    <rect class="row-even" x="24" y="184" width="572" height="44"/>
    <circle cx="46" cy="206" r="13" fill="#CD7F32"/>
    <text class="rank-num" fill="#1A1D24" x="46" y="211" text-anchor="middle">3</text>
    <circle cx="88" cy="206" r="9" fill="#2A2D36"/>
    <text class="team-name" x="106" y="211">大二队</text>
    <text class="cell-txt" text-anchor="middle" x="240" y="211">4</text>
    <text class="cell-txt" text-anchor="middle" x="310" y="211">2 / 0 / 2</text>
    <text class="cell-txt" text-anchor="middle" x="410" y="211">16 / 23</text>
    <text class="pts" text-anchor="end" x="576" y="212">6</text>

    <!-- Row 4 -->
    <rect x="24" y="228" width="572" height="44"/>
    <circle cx="46" cy="250" r="13" fill="#3A3D46"/>
    <text class="rank-num" fill="#FFFEF8" x="46" y="255" text-anchor="middle">4</text>
    <circle cx="88" cy="250" r="9" fill="#2A2D36"/>
    <text class="team-name" x="106" y="255">大三队</text>
    <text class="cell-txt" text-anchor="middle" x="240" y="255">4</text>
    <text class="cell-txt" text-anchor="middle" x="310" y="255">1 / 0 / 3</text>
    <text class="cell-txt" text-anchor="middle" x="410" y="255">15 / 22</text>
    <text class="pts" text-anchor="end" x="576" y="256">3</text>

    <!-- Row 5 -->
    <rect class="row-even" x="24" y="272" width="572" height="54" rx="0 0 8px 8px"/>
    <circle cx="46" cy="299" r="13" fill="#3A3D46"/>
    <text class="rank-num" fill="#FFFEF8" x="46" y="304" text-anchor="middle">5</text>
    <circle cx="88" cy="299" r="9" fill="#2A2D36"/>
    <text class="team-name" x="106" y="304">大四队</text>
    <text class="cell-txt" text-anchor="middle" x="240" y="304">4</text>
    <text class="cell-txt" text-anchor="middle" x="310" y="304">0 / 0 / 4</text>
    <text class="cell-txt" text-anchor="middle" x="410" y="304">5 / 18</text>
    <text class="pts" text-anchor="end" x="576" y="305">0</text>
  </g>

  <!-- Table border overlay -->
  <rect x="24" y="58" width="572" height="278" rx="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
</svg>