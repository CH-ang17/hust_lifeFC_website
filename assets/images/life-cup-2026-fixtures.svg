<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1180" width="520" height="1180">
  <defs>
    <style>
      .bg { fill: #1A1D24; rx: 12px; }
      .title { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 700; font-size: 18px; fill: #FFFEF8; }
      .sub-title { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #8A8780; letter-spacing: 0.04em; }
      .round-tag { fill: #003B5C; rx: 5px; }
      .round-txt { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 700; font-size: 13px; fill: #FFFEF8; }
      .match-card { fill: rgba(255,255,255,0.03); rx: 10px; }
      .match-card:hover { fill: rgba(255,255,255,0.06); }
      .date { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11.5px; fill: #8A8780; }
      .status-done { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #E85D5D; font-weight: 600; }
      .venue { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 10px; fill: #555; }
      .team-sub { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 10px; fill: #6B6860; text-anchor: middle; }
      .team-name { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; font-size: 13.5px; fill: #FFFEF8; text-anchor: middle; }
      .score { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 800; font-size: 26px; fill: #FFFEF8; letter-spacing: 1px; }
      .score-dash { fill: #555; font-weight: 400; letter-spacing: 0; margin: 0 2px; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="520" height="1180"/>

  <!-- Title area -->
  <text class="title" x="260" y="34" text-anchor="middle">第一届生命杯 · 全部赛程</text>
  <text class="sub-title" x="260" y="52" text-anchor="middle">2026 LIFE CUP · ALL MATCHES</text>

  <!-- ==================== 第1轮 ==================== -->
  <rect class="round-tag" x="20" y="72" width="56" height="28"/>
  <text class="round-txt" x="48" y="91" text-anchor="middle">第 1 轮</text>

  <!-- Match 1-1: 硕博 vs 大二 -->
  <g transform="translate(20,112)">
    <rect class="match-card" x="0" y="0" width="480" height="86"/>
    <text class="date" x="16" y="22">2026/05/24 17:00</text>
    <!-- Home -->
    <text class="team-name" x="140" y="48">硕博队</text>
    <text class="team-sub" x="140" y="62">主</text>
    <!-- Score -->
    <text class="score" x="240" y="58" text-anchor="middle"><tspan>12</tspan><tspan class="score-dash"> – </tspan><tspan>8</tspan></text>
    <!-- Away -->
    <text class="team-name" x="380" y="48">大二队</text>
    <text class="team-sub" x="380" y="62">客</text>
    <!-- Venue -->
    <text class="venue" x="240" y="80" text-anchor="middle">(2号场)</text>
