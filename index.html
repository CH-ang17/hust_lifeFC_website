<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUST 生命学院足球俱乐部 · HUST LIFE FC</title>
  <meta name="description" content="HUST 生命学院足球俱乐部官方站点 —— 新闻动态、球队阵容、比赛赛程与俱乐部故事。" />

  <!-- 预加载队徽（首屏关键资源） -->
  <link rel="preload" as="image" href="assets/images/logo-transparent.png" />

  <!-- 字体：非阻塞加载，失败不影响渲染 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..900&family=Manrope:wght@300..800&family=Poppins:wght@800&family=Space+Mono:wght@400;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..900&family=Manrope:wght@300..800&family=Poppins:wght@800&family=Space+Mono:wght@400;700&display=swap" />
  </noscript>

  <link rel="stylesheet" href="assets/css/styles.css?v=20260713al" />
</head>
<body>

  <!-- ============ NAV ============ -->
  <header class="nav" id="nav">
    <div class="wrap nav__inner">
      <a class="brand" href="#top" aria-label="HUST Life FC 首页">
        <img class="brand__logo" src="assets/images/logo-transparent.png" alt="HUST Life FC" width="36" height="36" />
        <span class="brand__name"><span id="brandName">HUST 生命学院足球俱乐部</span><small id="brandAbbr">HUST LIFE FC</small></span>
      </a>

      <nav class="nav__links" aria-label="主导航">
        <a href="#news">新闻</a>
        <a href="#club">俱乐部</a>
        <a href="#team">球队</a>
        <a href="#matches">比赛</a>
        <a href="data.html">数据</a>
        <a href="#contact">联系我们</a>
      </nav>

      <div style="display:flex; align-items:center; gap:0.75rem;">
        <button class="theme-toggle" id="themeToggle" aria-label="切换深色 / 浅色模式" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>

        <!-- 移动端汉堡菜单 -->
        <button class="nav__burger" id="navBurger" aria-label="打开导航菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <!-- 移动端下拉菜单 -->
    <div class="nav__dropdown" id="navDropdown" hidden>
      <a href="#news">新闻</a>
      <a href="#club">俱乐部</a>
      <a href="#team">球队</a>
      <a href="#matches">比赛</a>
      <a href="data.html">数据</a>
      <a href="#contact">联系我们</a>
    </div>
  </header>

  <main id="top">

    <!-- ============ HERO ============ -->
    <section class="hero">
      <div class="wrap hero__grid">
        <div class="hero__copy" id="heroCopy"><!-- 由 app.js 渲染 --></div>
        <aside class="hero__visual" id="heroVisual" aria-label="赛季卡片"><!-- 由 app.js 渲染 --></aside>
      </div>
    </section>

    <!-- ============ STATS BAR ============ -->
    <section class="stats" aria-label="球队数据">
      <div class="wrap">
        <div class="stats__grid" id="statsGrid"><!-- 由 app.js 渲染 --></div>
      </div>
    </section>

    <!-- ============ NEWS（新闻） ============ -->
    <section class="section" id="news">
      <div class="wrap">
        <div class="section-head">
          <div>
            <p class="eyebrow reveal">最新动态</p>
            <h2 class="reveal">新闻</h2>
          </div>
      </div>
        <div class="news__list" id="newsList"><!-- 由 app.js 渲染 --></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- ============ CLUB（俱乐部） ============ -->
    <section class="section" id="club">
      <div class="wrap">
        <!-- 俱乐部简介 -->
        <div class="section-head">
          <div>
            <p class="eyebrow reveal">关于我们</p>
            <h2 class="reveal">俱乐部</h2>
          </div>
        </div>
        <div class="club__intro reveal" id="clubIntro" style="margin-bottom:4rem;"><!-- 由 app.js 渲染 --></div>

        <!-- 荣誉 -->
        <div class="honors reveal" id="honorsWall" style="margin-top:3.5rem;">
          <h3 style="margin-bottom:1.5rem;">荣誉</h3>
          <div class="honors__grid" id="honorsGrid"><!-- 由 app.js 渲染 --></div>
        </div>

        <!-- 历史时间线 -->
        <div class="timeline reveal" id="timelineWrap" style="margin-top:3.5rem;">
          <h3 style="margin-bottom:1.5rem;">历史</h3>
          <div class="timeline__list" id="timelineList"><!-- 由 app.js 渲染 --></div>
        </div>

        <!-- 价值观 -->
        <div class="values reveal" style="margin-top:3.5rem;" id="clubValues"><!-- 由 app.js 渲染 --></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- ============ TEAM（球队） ============ -->
    <section class="section" id="team">
      <div class="wrap">
        <div class="section-head">
          <div>
            <p class="eyebrow reveal">球队阵容</p>
            <h2 class="reveal">球队</h2>
          </div>
        </div>

        <!-- 阵容：男足 / 女足 切换 -->
        <div class="squad__controls reveal">
          <div class="squad__tabs" id="squadTabs"></div>
          <div class="squad__season-wrap">
            <select class="squad__season" id="squadSeason"></select>
          </div>
        </div>

        <div class="squad__grid" id="squadGrid"></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- ============ MATCHES（比赛） ============ -->
    <section class="section" id="matches">
      <div class="wrap">
        <div class="section-head">
          <div>
            <p class="eyebrow reveal">赛程与战报</p>
            <h2 class="reveal">比赛</h2>
          </div>
        </div>

        <div class="match__filters reveal">
          <div class="comps" id="compsStrip"><!-- 由 app.js 渲染：全部 / 新生杯 / 华科杯 / 毕业杯 --></div>
          <div class="match__year-wrap">
            <label for="matchYear">赛季</label>
            <select id="matchYear" class="match__year"><!-- 由 app.js 渲染 --></select>
          </div>
        </div>

        <div class="fix__cols">
          <div class="fix__col reveal">
            <h3><span class="dot dot--win"></span>赛程战报</h3>
            <div id="fixRecent"><!-- 由 app.js 渲染 --></div>
            <div class="match__pager-wrap" id="fixRecentPager"></div>
          </div>
          <div class="fix__col reveal">
            <h3><span class="dot dot--up"></span>即将开赛</h3>
            <div id="fixUpcoming"><!-- 由 app.js 渲染 --></div>
          </div>
        </div>
      </div>
    </section>

    <hr class="divider" />

  </main>

  <!-- ============ FOOTER / CONTACT ============ -->
  <footer class="footer" id="contact">
    <div class="wrap">
      <div class="footer__top">
        <div>
          <div class="footer__brand">
            <img class="brand__logo" src="assets/images/logo-transparent.png" alt="" width="32" height="32" />
            <span class="brand__name" style="color:var(--paper);"><span id="footerBrandName">HUST 生命学院足球俱乐部</span><small id="footerBrandAbbr" style="color:var(--signal);">HUST LIFE FC</small></span>
          </div>
          <p id="footerIntro">DNA 之上，足球之中。欢迎来学院运动场看我们踢球，也欢迎加入 HUST Life FC。</p>
        </div>
        <div>
          <h4>快速链接</h4>
          <div class="footer__links" id="footerLinks"><!-- 由 app.js 渲染 --></div>
        </div>
        <div>
          <h4>关注我们</h4>
        </div>
        <div>
          <h4>联系我们</h4>
          <div id="footerContactWrap" class="footer__contact">
            <!-- 由 app.js 渲染邮箱/地址 -->
          </div>
        </div>
      </div>
      <div class="footer__bottom">
        <span id="footerCopyright">© 2026 HUST 生命学院足球俱乐部 · HUST LIFE FC</span>
        <span>LOVE FOOTBALL ♥ LOVE LIFE</span>
        <a href="admin.html" class="admin-link">⚙ 管理</a>
      </div>
    </div>
  </footer>

  <button class="to-top" id="toTop" type="button" title="回到顶部" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M12 5l-7 7h4v7h6v-7h4z" fill="currentColor" />
    </svg>
  </button>

  <!-- 新闻详情覆盖层 -->
  <div class="news-detail" id="newsDetail" aria-hidden="true"></div>

  <script src="assets/js/app.js?v=20260713s"></script>
</body>
</html>
