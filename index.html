<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生科院足球队 · LIFE SC. FC</title>
  <meta name="description" content="生科院足球队官方站点 —— 球队风采、赛季数据与比赛战报。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..900&family=Manrope:wght@300..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- ============ NAV ============ -->
  <header class="nav" id="nav">
    <div class="wrap nav__inner">
      <a class="brand" href="#top" aria-label="生科院足球队 首页">
        <svg class="brand__mark" viewBox="0 0 64 72" fill="none" aria-hidden="true">
          <path d="M32 2 60 13v22c0 18-13 30-28 35C19 65 4 53 4 35V13z" stroke="currentColor" stroke-width="3"/>
          <path d="M22 26h20M32 26v20M22 40c0-6 4.5-10 10-10s10 4 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="26" r="3.2" fill="currentColor"/>
        </svg>
        <span class="brand__name"><span id="brandName">生科院足球队</span><small id="brandAbbr">LIFE SC. FC</small></span>
      </a>

      <nav class="nav__links" aria-label="主导航">
        <a href="#squad">阵容</a>
        <a href="#fixtures">赛程</a>
        <a href="#story">球队</a>
        <a href="#contact">联系</a>
      </nav>

      <div style="display:flex; align-items:center; gap:0.75rem;">
        <a class="btn btn--primary nav__cta" href="#fixtures">查看赛程 <span class="arrow">→</span></a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换深色 / 浅色模式" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">

    <!-- ============ HERO ============ -->
    <section class="hero">
      <div class="wrap hero__grid">
        <div class="hero__copy" id="heroCopy"><!-- 由 app.js 渲染 --></div>

        <aside class="hero__visual" id="heroVisual" aria-label="赛季卡片"><!-- 由 app.js 渲染 --></aside>
      </div>
    </section>

    <!-- ============ STATS ============ -->
    <section class="stats" aria-label="球队数据">
      <div class="wrap">
        <div class="stats__grid" id="statsGrid"><!-- 由 app.js 渲染 --></div>
      </div>
    </section>

    <!-- ============ SQUAD ============ -->
    <section class="section" id="squad">
      <div class="wrap">
        <div class="section-head">
          <div>
            <p class="eyebrow reveal">一队阵容 · 2026</p>
            <h2 class="reveal">场上十一人</h2>
          </div>
          <p class="lead reveal" style="max-width:34ch;">从门将到边锋，每个人都有属于自己的号码与故事。</p>
        </div>
        <div class="squad__grid" id="squadGrid"><!-- 由 app.js 渲染 --></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- ============ FIXTURES ============ -->
    <section class="section" id="fixtures">
      <div class="wrap">
        <div class="section-head">
          <div>
            <p class="eyebrow reveal">赛程与战报</p>
            <h2 class="reveal">最近 &amp; 接下来</h2>
          </div>
          <a class="btn btn--ghost reveal" href="#contact">订阅提醒</a>
        </div>

        <div class="fix__cols">
          <div class="fix__col reveal">
            <h3><span class="dot dot--win"></span>最近战报</h3>
            <div id="fixRecent"><!-- 由 app.js 渲染 --></div>
          </div>
          <div class="fix__col reveal">
            <h3><span class="dot dot--up"></span>接下来</h3>
            <div id="fixUpcoming"><!-- 由 app.js 渲染 --></div>
          </div>
        </div>
      </div>
    </section>

    <hr class="divider" />

    <!-- ============ STORY ============ -->
    <section class="section" id="story">
      <div class="wrap story__grid" id="storyGrid"><!-- 由 app.js 渲染 --></div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer" id="contact">
    <div class="wrap">
      <div class="footer__top">
        <div>
          <div class="footer__brand">
            <svg class="brand__mark" viewBox="0 0 64 72" fill="none" aria-hidden="true">
              <path d="M32 2 60 13v22c0 18-13 30-28 35C19 65 4 53 4 35V13z" stroke="currentColor" stroke-width="3"/>
              <path d="M22 26h20M32 26v20M22 40c0-6 4.5-10 10-10s10 4 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <circle cx="32" cy="26" r="3.2" fill="currentColor"/>
            </svg>
            <span class="brand__name" style="color:var(--paper);"><span id="footerBrandName">生科院足球队</span><small id="footerBrandAbbr" style="color:var(--signal);">LIFE SC. FC</small></span>
          </div>
          <p id="footerIntro">绿茵之上，皆是兄弟。欢迎来学院运动场看我们踢球，也欢迎加入我们。</p>
        </div>
        <div>
          <h4>导航</h4>
          <div class="footer__links" id="footerLinks"><!-- 由 app.js 渲染 --></div>
        </div>
        <div>
          <h4>关注我们</h4>
          <div class="footer__links" id="footerSocial"><!-- 由 app.js 渲染 --></div>
        </div>
      </div>
      <div class="footer__bottom">
        <span id="footerCopyright">© 2026 生科院足球队 · LIFE SC. FC</span>
        <span>DESIGNED WITH ♥ ON CAMPUS</span>
      </div>
    </div>
  </footer>

  <a class="admin-fab" href="admin.html" title="管理后台">⚙ 管理</a>

  <script src="assets/js/app.js"></script>
</body>
</html>
