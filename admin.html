<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · HUST 生命学院足球俱乐部</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..900&family=Manrope:wght@300..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="admin">

  <!-- ============ NAV ============ -->
  <header class="nav admin__nav">
    <div class="wrap nav__inner">
      <a class="brand" href="index.html" aria-label="返回站点首页">
        <img class="brand__logo" src="assets/images/logo-transparent.png" alt="HUST 生命学院足球俱乐部队徽" />
        <span class="brand__name"><span>管理后台</span><small>CONTROL ROOM</small></span>
      </a>
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <a class="btn btn--ghost" href="index.html" target="_blank" rel="noopener">查看站点 ↗</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换深色 / 浅色模式" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap admin__main">

    <!-- ============ 连接 / 登录 ============ -->
    <section class="card admin__card" id="screen-connect">
      <h2>连上 GitHub 仓库</h2>
      <p class="lead" style="max-width:60ch; margin-bottom:1.5rem;">
        网站托管在 <b>GitHub Pages</b>，后台通过 GitHub API 直接把修改提交进仓库。需要你的
        <b>个人访问令牌 (PAT)</b>，令牌只保存在本浏览器，不会上传。
      </p>

      <div class="a-form">
        <div class="a-row">
          <label class="a-field">
            <span>仓库所有者 / 组织</span>
            <input id="f-owner" class="a-input" placeholder="例如 life-sc-fc" autocomplete="off" />
          </label>
          <label class="a-field">
            <span>仓库名</span>
            <input id="f-repo" class="a-input" placeholder="例如 team-site" autocomplete="off" />
          </label>
        </div>
        <div class="a-row">
          <label class="a-field">
            <span>分支</span>
            <input id="f-branch" class="a-input" value="main" autocomplete="off" />
          </label>
          <label class="a-field">
            <span>个人访问令牌 (PAT)</span>
            <input id="f-token" class="a-input" type="password" placeholder="github_pat_xxx" autocomplete="off" />
          </label>
        </div>
        <div class="a-hint">
          <button type="button" class="btn btn--ghost btn--sm" id="btn-detect">从当前网址自动识别</button>
          <a class="a-link" href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">如何生成 PAT？↗</a>
        </div>
        <p class="a-note">PAT 权限：只读「Contents」即可浏览；要保存修改需勾选 <code>Contents</code> 的 <b>Read and write</b>。</p>
        <button type="button" class="btn btn--primary" id="btn-connect">连接并加载内容</button>
      </div>
    </section>

    <!-- ============ 口令 ============ -->
    <section class="card admin__card" id="screen-passcode" hidden>
      <p class="eyebrow">第一步 · 站点口令</p>
      <h2 id="passcode-title">输入站点口令</h2>
      <p class="lead" id="passcode-desc" style="max-width:52ch; margin-bottom:1.5rem;">内容受口令保护，输入口令以进入编辑器。</p>
      <div class="a-form">
        <label class="a-field">
          <span>口令</span>
          <input id="f-passcode" class="a-input" type="password" placeholder="••••••" autocomplete="off" />
        </label>
        <button type="button" class="btn btn--primary" id="btn-passcode">进入编辑器</button>
        <button type="button" class="btn btn--ghost btn--sm" id="btn-back-connect">返回</button>
      </div>
    </section>

    <!-- ============ 编辑器 ============ -->
    <section id="screen-editor" hidden>
      <div class="admin__bar">
        <strong id="editor-repo">—</strong>
        <div class="admin__bar-actions">
          <button type="button" class="btn btn--ghost btn--sm" id="btn-export">导出 JSON</button>
          <button type="button" class="btn btn--ghost btn--sm" id="btn-import">导入 JSON</button>
          <input id="file-import" type="file" accept="application/json" hidden />
          <button type="button" class="btn btn--primary" id="btn-save">保存修改</button>
          <button type="button" class="btn btn--ghost btn--sm" id="btn-exit">退出</button>
        </div>
      </div>
      <div id="editor-root" class="admin__editor"><!-- 由 admin.js 动态生成 --></div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <script src="assets/js/admin.js"></script>
</body>
</html>
