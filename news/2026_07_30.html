      <h1>生命学院男子足球队新赛季球衣正式发布</h1>
      <p>2026-2027 新赛季的大幕即将拉开，生命学院男子足球队（HUST LIFE FC 男足）新赛季球衣今日正式发布。</p>
<p>新球衣延续了生命学院足球俱乐部的经典视觉基因，以学院深蓝为主色调，搭配简洁利落的线条设计，在保留球队辨识度的同时更显现代与专业。</p>
<p>球衣的正式发布，也意味着球队新赛季的征程正式起步。新赛季，男足将继续征战华中科技大学足球联赛（华科杯）乙组，全队将以全新的面貌迎接每一场挑战。</p>
<p>球衣设计、视频制作：戴晨曦</p>
