      <h1>祝贺！生科女足队员周孟雪、苏婕欣入选华中科技大学校女子足球队全国赛大名单</h1>
      <p>祝贺生命学院足球俱乐部女子足球队成员周孟雪、苏婕欣入选华中科技大学校女子足球队全国赛大名单，将于7月18日至7月28日在云南泸西，征战2026年全国青少年校园足球四级联赛全国总决赛（大学女子乙组）。两位队员作为校队成员在去年帮助校女足获得湖北省青少年校园足球联赛（大学组）女子校园组冠军，也在今年作为HUST LIFE FC女子足球队的主力成员，帮助球队获得华科杯女子组亚军。祝愿她们在这届全国赛中也有出色的发挥。</p>
