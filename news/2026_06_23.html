      <h1>第一届生命杯成功举办，硕博队夺冠</h1>
      <p>历时三周，单循环共10场比赛，大一、大二、大三、大四、硕博五支队伍共同角逐第一届生命杯。</p>
<p>6月14日下午15:00，东操小场，赛事最后一场比赛在硕博队和大一队之间打响，这也是决定冠军归属的一战。最终硕博队3:2战胜大一队，以4场全胜战绩夺冠。</p>
<p>本次赛事促进了学院内部的足球交流，使更多的同学参与足球运动。</p>
